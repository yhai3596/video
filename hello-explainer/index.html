<!doctype html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- GSAP 本地化：渲染用的 Chromium 不走代理，CDN 会加载失败 -->
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "CJK";
        src: local("Noto Sans CJK SC");
        font-weight: 400;
      }
      @font-face {
        font-family: "CJK";
        src: local("Noto Sans CJK SC Bold");
        font-weight: 700;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b1220;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "CJK", sans-serif;
        color: #e6edf7;
        /* 工程蓝图网格 */
        background-color: #0b1220;
        background-image:
          linear-gradient(rgba(90, 140, 220, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(90, 140, 220, 0.08) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* 场景 1：标题 */
      #s1-title {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #s1-sub {
        margin-top: 28px;
        font-size: 44px;
        color: #8fb4e8;
      }

      /* 场景 2：流水线 */
      #s2-head {
        font-size: 56px;
        font-weight: 700;
        margin-bottom: 90px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 36px;
      }
      .box {
        width: 330px;
        height: 200px;
        border: 3px solid #3a5f99;
        border-radius: 20px;
        background: rgba(20, 36, 64, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .box .n {
        font-size: 30px;
        color: #8fb4e8;
      }
      .box .t {
        font-size: 42px;
        font-weight: 700;
      }
      /* 点亮层叠在框上，用 opacity 做动画（seek 安全） */
      .box {
        position: relative;
      }
      .box .lit {
        position: absolute;
        inset: -3px;
        border: 3px solid #f2a541;
        border-radius: 20px;
        background: rgba(242, 165, 65, 0.12);
        box-shadow: 0 0 40px rgba(242, 165, 65, 0.45);
        opacity: 0;
      }
      .arrow {
        font-size: 56px;
        color: #6f95cf;
      }

      /* 场景 3：收尾 */
      #s3-text {
        font-size: 96px;
        font-weight: 700;
      }
      #s3-check {
        color: #5fd39a;
      }
      #s3-sub {
        margin-top: 24px;
        font-size: 40px;
        color: #8fb4e8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <section id="s1" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <h1 id="s1-title">代码即视频</h1>
        <p id="s1-sub">Claude 写 HTML，HyperFrames 渲染成 MP4</p>
      </section>

      <section id="s2" class="clip" data-start="3" data-duration="5.5" data-track-index="0">
        <h2 id="s2-head">一条最小闭环</h2>
        <div class="row">
          <div class="box" id="b1"><div class="lit"></div><span class="n">01</span><span class="t">分镜脚本</span></div>
          <span class="arrow" id="a1">→</span>
          <div class="box" id="b2"><div class="lit"></div><span class="n">02</span><span class="t">HTML + GSAP</span></div>
          <span class="arrow" id="a2">→</span>
          <div class="box" id="b3"><div class="lit"></div><span class="n">03</span><span class="t">逐帧截图</span></div>
          <span class="arrow" id="a3">→</span>
          <div class="box" id="b4"><div class="lit"></div><span class="n">04</span><span class="t">合成 MP4</span></div>
        </div>
      </section>

      <section id="s3" class="clip" data-start="8" data-duration="2" data-track-index="0">
        <p id="s3-text">跑通了 <span id="s3-check">✓</span></p>
        <p id="s3-sub">下一步：真实选题 + 逐句配音</p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // 场景 1
      tl.fromTo("#s1-title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.2);
      tl.fromTo("#s1-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.7);
      tl.to("#s1", { opacity: 0, duration: 0.4 }, 2.6);

      // 场景 2：标题进场，四个框依次出现，再依次点亮
      tl.fromTo("#s2-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5 }, 3.1);
      ["#b1", "#a1", "#b2", "#a2", "#b3", "#a3", "#b4"].forEach((sel, i) => {
        tl.fromTo(sel, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.4 + i * 0.15);
      });
      ["#b1", "#b2", "#b3", "#b4"].forEach((sel, i) => {
        const t = 4.8 + i * 0.7;
        tl.to(`${sel} .lit`, { opacity: 1, duration: 0.3 }, t);
        if (i < 3) tl.to(`${sel} .lit`, { opacity: 0.35, duration: 0.3 }, t + 0.7);
      });
      tl.to("#s2", { opacity: 0, duration: 0.4 }, 7.6);

      // 场景 3
      tl.fromTo("#s3-text", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 8.1);
      tl.fromTo("#s3-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 8.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
